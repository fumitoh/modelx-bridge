# Publish one package to PyPI from a tag:
#
#   bridge-v0.10.0   builds and publishes modelx-bridge 0.10.0
#   mcp-v0.1.0       builds and publishes modelx-mcp 0.1.0
#
# The tag must equal the version in the code (VERSION in
# modelx-bridge/modelx_bridge/methods.py, __version__ in
# modelx-mcp/modelx_mcp/__init__.py); check_dists.py refuses anything else.
# The built wheel is installed into a clean Python and its own suites run
# against it before anything is uploaded. A modelx-mcp release installs
# modelx-bridge from PyPI, as a user would, so it fails until the bridge
# version it needs has been published: release the bridge first.
#
# Uploads use PyPI trusted publishing (OIDC): there is no token in this
# repository. NOTHING CAN BE PUBLISHED UNTIL THE OWNER CONFIGURES IT ON PyPI.
# For each of modelx-bridge and modelx-mcp, add a (pending) trusted publisher
# with owner fumitoh, repository modelx-bridge, workflow release.yml and
# environment pypi. Until then a tag still builds and tests, and the upload
# step fails at the token exchange without uploading anything.

name: release

on:
  push:
    tags:
      - "bridge-v*"
      - "mcp-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      project: ${{ steps.pick.outputs.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Which package the tag names
        id: pick
        run: |
          case "$GITHUB_REF_NAME" in
            bridge-v*) project=modelx-bridge; package=modelx_bridge ;;
            mcp-v*)    project=modelx-mcp;    package=modelx_mcp ;;
            *) echo "::error::$GITHUB_REF_NAME names neither package"; exit 1 ;;
          esac
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Install the build tools
        run: python -m pip install build==1.6.1 twine==7.0.0

      - name: Build that package only
        run: python -m build -o dist "${{ steps.pick.outputs.project }}"

      - name: Check it
        run: |
          python -m twine check --strict dist/*
          python .github/check_dists.py dist --tag "$GITHUB_REF_NAME"

      - name: Install the wheel into a clean Python and run its suites
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
          site="$("$RUNNER_TEMP/venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          project="${{ steps.pick.outputs.project }}"
          package="${{ steps.pick.outputs.package }}"
          cp -r "$project/$package/tests" "$site/$package/tests"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -m "$package.tests.run_all"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.project }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
